  <rect x="788" y="150" width="96" height="64" fill="#ffffff" stroke="#ff247d" stroke-width="1.5"/>
  <text x="836" y="176" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0d1226">FEEDBACK</text>
  <text x="836" y="200" font-size="7.5" text-anchor="middle" fill="#ff247d">loop not closed</text>
  <rect x="862" y="143" width="20" height="14" fill="#ff247d"/>
  <text x="872" y="153" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#f8f8fa">L6</text>

  <!-- ═══ connectors ═══ -->
  <line x1="128" y1="182" x2="138" y2="182" stroke="#0d1226" marker-end="url(#mInk)"/>
  <line x1="236" y1="182" x2="246" y2="182" stroke="#0d1226" marker-end="url(#mInk)"/>
  <line x1="344" y1="182" x2="354" y2="182" stroke="#0d1226" marker-end="url(#mInk)"/>
  <line x1="452" y1="182" x2="462" y2="182" stroke="#0d1226" marker-end="url(#mInk)"/>
  <line x1="560" y1="182" x2="570" y2="182" stroke="#0d1226" marker-end="url(#mInk)"/>
  <line x1="668" y1="182" x2="678" y2="182" stroke="#0d1226" marker-end="url(#mInk)"/>
  <line x1="776" y1="182" x2="786" y2="182" stroke="#0d1226" marker-end="url(#mInk)"/>

  <!-- feedback loop: Feedback → Planning, dashed pink (not yet real) -->
  <path d="M836,150 L836,120 L188,120 L188,148" fill="none" stroke="#ff247d" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#mPink)"/>
  <text x="512" y="114" font-size="8.5" text-anchor="middle" fill="#ff247d" letter-spacing="0.5">EVIDENCE LOOP — PROPOSED, NOT YET BUILT (SUG-241)</text>

  <!-- ═══ legend ═══ -->
  <rect x="32" y="252" width="12" height="12" fill="#ffffff" stroke="#0d1226"/>
  <text x="52" y="262" font-size="9" fill="#0d1226" fill-opacity="0.75">Verified, currently working as documented</text>

  <rect x="32" y="272" width="12" height="12" fill="#ffffff" stroke="#ff247d" stroke-width="1.5"/>
  <text x="52" y="282" font-size="9" fill="#0d1226" fill-opacity="0.75">Enforcement gap — tracked in Linear (SUG-239, SUG-240, SUG-241)</text>

  <line x1="32" y1="300" x2="44" y2="300" stroke="#ff247d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="52" y="304" font-size="9" fill="#0d1226" fill-opacity="0.75">Proposed connection, not yet built</text>

  <rect x="32" y="312" width="20" height="14" fill="#0d1226"/>
  <text x="42" y="322" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#f8f8fa">L#</text>
  <text x="60" y="322" font-size="9" fill="#0d1226" fill-opacity="0.75">Primary AI-governance layer this phase serves — L1 Inventory · L2 Data Foundation · L5 Human Oversight · L6 Compliance &amp; Audit</text>

  <!-- ═══ footer ═══ -->
  <line x1="32" y1="350" x2="888" y2="350" stroke="#0d1226" stroke-opacity="0.15"/>
  <text x="32" y="368" font-size="8.5" fill="#0d1226" fill-opacity="0.55">Companion claim table: docs/diagrams/redpen-workflow-current-state.md · Full detail: docs/diagrams/diagram-workflow-full-detail.svg</text>
  <text x="32" y="384" font-size="8.5" fill="#0d1226" fill-opacity="0.55">Source epics: SUG-239 (enforcement gaps) · SUG-240 (route smoke tests) · SUG-241 (feedback loop) · SUG-242 (vspec rename) · SUG-244 (this diagram, live on /governance) · SUG-245 (page accuracy)</text>
  <text x="32" y="400" font-size="8.5" fill="#0d1226" fill-opacity="0.55">L-badges: layers L3 (Data Security) and L4 (Model Assurance) are inherited/partial and don't map to a single phase — see the six-layer table for full coverage.</text>
</svg>
