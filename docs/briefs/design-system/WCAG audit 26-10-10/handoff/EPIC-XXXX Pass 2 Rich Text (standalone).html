  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

US CHIP TOKENS\n   Light Pink Moon defaults; full spectrum from canonical theme.pink-moon.css\n   ══════════════════════════════════════════════ */\n:root,\n[data-theme=\"light-pink-moon\"] {\n  --st-status-draft-bg:               var(--st-color-error-bg);\n  --st-status-draft-fg:               var(--st-color-error);\n  --st-status-draft-border:           var(--st-color-error-border);\n\n  --st-status-active-bg:              rgba(29, 150, 121, 0.08);\n  --st-status-active-fg:              var(--st-color-seafoam-800);   /* WCAG AA */\n  --st-status-active-border:          rgba(29, 150, 121, 0.35);\n\n  --st-status-archived-bg:            rgba(148, 163, 184, 0.06);\n  --st-status-archived-fg:            var(--st-color-softgrey-700);\n  --st-status-archived-border:        rgba(148, 163, 184, 0.20);\n\n  --st-status-implemented-bg:         rgba(29, 150, 121, 0.08);\n  --st-status-implemented-fg:         var(--st-color-seafoam-800);\n  --st-status-implemented-border:     rgba(29, 150, 121, 0.35);\n\n  --st-status-evergreen-bg:           rgba(116, 143, 0, 0.08);\n  --st-status-evergreen-fg:           var(--st-color-lime-800);\n  --st-status-evergreen-border:       rgba(116, 143, 0, 0.30);\n\n  --st-status-validated-bg:           rgba(185, 28, 104, 0.08);\n  --st-status-validated-fg:           var(--st-color-maroon);\n  --st-status-validated-border:       rgba(185, 28, 104, 0.30);\n\n  --st-status-deprecated-bg:          rgba(148, 163, 184, 0.08);\n  --st-status-deprecated-fg:          var(--st-color-softgrey-700);\n  --st-status-deprecated-border:      rgba(110, 127, 150, 0.25);\n\n  --st-status-exploring-bg:           rgba(29, 150, 121, 0.07);\n  --st-status-exploring-fg:           var(--st-color-seafoam-800);\n  --st-status-exploring-border:       rgba(29, 150, 121, 0.30);\n\n  --st-status-operationalized-bg:     rgba(21, 115, 92, 0.08);\n  --st-status-operationalized-fg:     var(--st-color-seafoam-800);\n  --st-status-operationalized-border: rgba(21, 115, 92, 0.30);\n\n  --st-status-dreaming-bg:            rgba(124, 58, 237, 0.08);\n  --st-status-dreaming-fg:            var(--st-color-violet-600);\n  --st-status-dreaming-border:        rgba(124, 58, 237, 0.30);\n\n  --st-status-designing-bg:           rgba(146, 112, 12, 0.08);\n  --st-status-designing-fg:           var(--st-color-amber-700);\n  --st-status-designing-border:       rgba(146, 112, 12, 0.30);\n\n  --st-status-developing-bg:          rgba(21, 115, 92, 0.08);\n  --st-status-developing-fg:          var(--st-color-seafoam-800);\n  --st-status-developing-border:      rgba(21, 115, 92, 0.30);\n\n  --st-status-testing-bg:             rgba(194, 65, 12, 0.08);\n  --st-status-testing-fg:             var(--st-color-orange-700);\n  --st-status-testing-border:         rgba(194, 65, 12, 0.30);\n\n  --st-status-deploying-bg:           rgba(116, 143, 0, 0.08);\n  --st-status-deploying-fg:           var(--st-color-lime-800);\n  --st-status-deploying-border:       rgba(116, 143, 0, 0.30);\n\n  --st-status-iterating-bg:           rgba(3, 105, 161, 0.08);\n  --st-status-iterating-fg:           var(--st-color-sky-700);\n  --st-status-iterating-border:       rgba(3, 105, 161, 0.30);\n}\n\n/* ══════════════════════════════════════════════\n   TIER 3 — CHIP RULE-DOT TOKENS (SUG-88)\n   ══════════════════════════════════════════════ */\n:root {\n  --st-chip-bg:             transparent;\n  --st-chip-border:         var(--st-color-rule-accent);\n  --st-chip-fg:             var(--st-color-text-default);\n  --st-chip-dot-size:       6px;\n\n  /* Pink rubric — taxonomy first-child (light defaults) */\n  --st-chip-rubric-bg:      color-mix(in srgb, var(--st-color-pink) 10%, white);\n  --st-chip-rubric-border:  var(--st-color-pink);\n  --st-chip-rubric-fg:      var(--st-color-maroon);\n\n  /* Status dot colors (light defaults) */\n  --st-chip-dot-evergreen:  var(--st-color-lime-700);\n  --st-chip-dot-validated:  var(--st-color-seafoam-700);\n  --st-chip-dot-exploring:  var(--st-color-amber-700);\n ar(--st-color-pink);\n  --st-table-wrap-border:           var(--st-color-border-wrap);\n  --st-table-border:                rgba(255, 255, 255, 0.08);\n  --st-table-card-radius:           var(--st-radius-md);\n}\n\n:root,\n[data-theme=\"light-pink-moon\"] {\n  /* Light Pink Moon overrides (theme.pink-moon.css) */\n  --st-table-header-bg-accent:      var(--st-color-pink);\n  --st-table-header-color-accent:   var(--st-color-white);\n  --st-table-header-bg-subdued:     var(--st-color-neutral-100);\n  --st-table-header-color-subdued:  var(--st-color-text-muted);\n  --st-table-zebra-bg:              var(--st-color-softgrey-50);\n  --st-table-border:                var(--st-color-softgrey-200);\n  --st-table-row-hover-bg:          color-mix(in srgb, var(--st-color-pink) 2.5%, transparent);\n}\n\n[data-theme=\"dark-pink-moon\"],\n[data-theme=\"dark\"] {\n  /* Dark Pink Moon overrides (theme.pink-moon.css) */\n  --st-table-header-bg-accent:      var(--st-color-pink);       /* stays pink on dark canvas */\n  --st-table-header-color-accent:   var(--st-color-white);\n  --st-table-header-bg-subdued:     var(--st-color-midnight-700); /* #1c2240 — opaque, no glassmorphism */\n  --st-table-header-color-subdued:  var(--st-color-text-muted);\n  --st-table-row-hover-bg:          color-mix(in srgb, var(--st-color-pink) 4%, transparent);\n}\n\n/* ══════════════════════════════════════════════\n   SEMANTIC ELEMENT DEFAULTS\n   ══════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { background: var(--st-color-bg-canvas); }\n\nbody {\n  margin: 0;\n  font-family: var(--st-font-ui);\n  font-size: var(--st-font-size-md);\n  line-height: var(--st-line-height-normal);\n  color: var(--st-color-text-default);\n  background: var(--st-color-bg-canvas);\n  -webkit-font-smoothing: antialiased;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  margin: 0 0 var(--st-space-4);\n  font-family: var(--st-font-narrative);\n  font-weight: 600;\n  color: var(--st-color-text-primary);\n  line-height: var(--st-line-height-tight);\n}\nh1 { font-size: var(--st-font-heading-1); }\nh2 { font-size: var(--st-font-heading-2); }\nh3 { font-size: var(--st-font-heading-3); }\nh4 { font-size: var(--st-font-heading-4); }\n\np { margin: 0 0 var(--st-space-4); }\n\na {\n  color: var(--st-color-link-default);\n  text-decoration: none;\n  transition: color 150ms ease;\n}\na:hover { color: var(--st-color-link-hover); text-decoration: underline; }\n\ncode, kbd, samp, pre { font-family: var(--st-font-mono); }\n\n:not(pre) > code {\n  font-size: 0.85em;\n  padding: 0.2em 0.5em;\n  background: var(--st-color-softgrey-100);\n  border: 1px solid var(--st-color-softgrey-200);\n  color: var(--st-color-maroon);\n  border-radius: 4px;\n}\n\n/* ── Uppercase mono label utility ── */\n.st-label {\n  font-family: var(--st-label-font);\n  font-size: var(--st-label-size);\n  font-weight: var(--st-label-weight);\n  letter-spacing: var(--st-label-tracking);\n  text-transform: uppercase;\n  color: var(--st-label-color);\n  line-height: 1.2;\n}\n\n.st-eyebrow {\n  font-family: var(--st-font-mono);\n  font-size: var(--st-font-size-xs);\n  font-weight: 700;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  color: var(--st-color-text-eyebrow);\n}\n<\u002Fstyle>\n<style>\n:root{--ink:var(--st-color-ink);--muted:var(--st-color-text-secondary);--rule:var(--st-color-softgrey-200);--pink:var(--st-color-pink);--pink6:var(--st-color-pink-600);--maroon:var(--st-color-maroon);--bg:var(--st-color-bg-surface)}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--st-font-ui);text-wrap:pretty}\na{color:var(--maroon);text-decoration:underline;text-decoration-color:var(--pink);text-underline-offset:2px}a:hover{text-decoration-thickness:2px}\nmain{max-width:860px;margin:0 auto;padding:56px 28px 96px}\nh1,h2{font-family:var(--st-font-narrative);font-weight:600}\nh1{font-size:2.6rem;line-height:1.1;margin:0 0 20px;padding-bottom:18px; 02Fp>\n<p>Every change is written as <strong>current value → new value<\u002Fstrong>. No PRD; assumptions below.<\u002Fp>\n<h2>The four inline marks after this epic<\u002Fh2>\n<div class=\"tw\"><table><thead><tr><th>Mark<\u002Fth><th>Light<\u002Fth><th>Dark<\u002Fth><th>Cue that works without colour<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>Link<\u002Ftd><td>maroon text, pink underline<\u002Ftd><td>pink text, pink underline<\u002Ftd><td>solid underline<\u002Ftd><\u002Ftr><tr><td>Glossary term<\u002Ftd><td>ink on pink-50, pink dotted underline<\u002Ftd><td>white on 14% pink, pink dotted underline<\u002Ftd><td>dotted underline + fill<\u002Ftd><\u002Ftr><tr><td>Citation marker<\u002Ftd><td>maroon<\u002Ftd><td>pink<\u002Ftd><td><code>[N]<\u002Fcode> superscript, mono<\u002Ftd><\u002Ftr><tr><td>Inline code<\u002Ftd><td>maroon on softgrey-100, maroon-200 outline<\u002Ftd><td>pink-300 on midnight-700, pink-800 outline<\u002Ftd><td>mono, outlined box<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p>No lime and no seafoam in rich text. This supersedes SUG-211 Option E (seafoam code, lime glossary).<\u002Fp>\n<h2>Pre-Execution Completeness Gate<\u002Fh2>\n<ul class=\"check\"><li class=\"open\"><span class=\"box\"><\u002Fspan><span><strong>Epic ID<\u002Fstrong> — OPEN (Bex): assign next EPIC number, rename file.<\u002Fspan><\u002Fli><li class=\"open\"><span class=\"box\"><\u002Fspan><span><strong>File paths<\u002Fstrong> — OPEN (Claude Code, step 0): the glossary term component, the portable-text link serializer/prose styles and the footnote list are not in <code>packages/design-system/src/components<\u002Fcode>. Locate them and record element types, ARIA and current CSS before editing.<\u002Fspan><\u002Fli><li class=\"done\"><span class=\"box\">✓<\u002Fspan><span><strong>Layout contract<\u002Fstrong> — no layout changes. Colour, decoration, ARIA, markup semantics, two size tokens.<\u002Fspan><\u002Fli><li class=\"done\"><span class=\"box\">✓<\u002Fspan><span><strong>Enum values<\u002Fstrong> — none touched.<\u002Fspan><\u002Fli><li class=\"done\"><span class=\"box\">✓<\u002Fspan><span><strong>Dark / theme treatment<\u002Fstrong> — explicit per item.<\u002Fspan><\u002Fli><li class=\"open\"><span class=\"box\"><\u002Fspan><span><strong>Schema changes<\u002Fstrong> — expected none. If the glossary popover needs a field that isn't in the GROQ projection, STOP and flag.<\u002Fspan><\u002Fli><li class=\"open\"><span class=\"box\"><\u002Fspan><span><strong>Web adapter<\u002Fstrong> — OPEN: confirm whether the glossary and footnote components live in <code>packages/design-system<\u002Fcode>, <code>apps/web<\u002Fcode>, or both.<\u002Fspan><\u002Fli><\u002Ful>\n<h2>Scope (execution order)<\u002Fh2>\n<h3>1. Prose links underlined<\u002Fh3>\n<p>Prose scopes only (portable text, article body, node body). Nav, card and chip links stay bare.<\u002Fp>\n<div class=\"tw\"><table><thead><tr><th>Property<\u002Fth><th>Current<\u002Fth><th>New<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>color<\u002Ftd><td><code>var(--st-color-link-default)<\u002Fcode><\u002Ftd><td>unchanged (maroon light after Pass 1, pink dark)<\u002Ftd><\u002Ftr><tr><td>text-decoration-line<\u002Ftd><td>locate<\u002Ftd><td><code>underline<\u002Fcode><\u002Ftd><\u002Ftr><tr><td>text-decoration-color<\u002Ftd><td>locate<\u002Ftd><td><code>var(--st-color-brand-primary)<\u002Fcode><\u002Ftd><\u002Ftr><tr><td>text-decoration-thickness<\u002Ftd><td>locate<\u002Ftd><td><code>1px<\u002Fcode>; hover <code>2px<\u002Fcode><\u002Ftd><\u002Ftr><tr><td>text-underline-offset<\u002Ftd><td>locate<\u002Ftd><td><code>var(--st-link-underline-offset)<\u002Fcode> (2px, existing)<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<h3>2. Inline code → maroon / pink (theme.pink-moon.css)<\u002Fh3>\n<div class=\"tw\"><table><thead><tr><th>Token<\u002Fth><th>Current<\u002Fth><th>New<\u002Fth><th>Result<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>light <code>--st-code-inline-color<\u002Fcode> + <code>--st-code-inline-text<\u002Fcode><\u002Ftd><td><code>var(--st-color-seafoam-800)<\u002Fcode><\u002Ftd><td><code>var(--st-color-text-brand)<\u002Fcode><\u002Ftd><td>5.15 → 5.47<\u002Ftd><\u002Ftr><tr><td>light <code>--st-code-inline-border<\u002Fcode><\u002Ftd><td><code>1px solid var(--st-color-seafoam-300)<\u002Fcode><\u002Ftd><td><code>1px solid var(--st-color-maroon-200)<\u002Fcode><\u002Ftd><td>—<\u002Ftd><\u002Ftr><tr><td>light <code>--st-code-inline-bg<\u002Fcode><\u002Ftd><td><code>var(--st-color-softgrey-100)<\u002Fcode><\u002Ftd><td>unchanged<\u002Ftd><td>—<\u002Ftd><\u002Ftr><tr><td>dark <code>--st-code-inline-color<\u002Fcode> + <code>--st-code-inline-text<\u002Fcode><\u002Ftd><td><code>var(--st-color-seafoam-500)<\u002Fcode><\u002Ftd><td><code>var(--st-color-pink-300)<\u002Fcode><\u002Ftd><td>8.21 → 6.66<\u002Ftd><\u002Ftr><tr><td>dark <code>--st-code-inline-border<\u002Fcode><\u002Ftd><td><code>1px solid var(--st-color-seafoam-700)<\u002Fcode><\u002Ftd><td><code>1px solid var(--st-color-pink-800)<\u002Fcode><\u002Ftd><td>—<\u002Ftd><\u002Ftr><tr><td>dark <code>--st-code-inline-bg<\u002Fcode><\u002Ftd><td><code>var(--st-color-midnight-700)<\u002Fcode><\u002Ftd><td>unchanged<\u002Ftd><td>—<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p>Mirror the light values into the <code>tokens.css<\u002Fcode> base <code>--st-code-inline-*<\u002Fcode> so the base and light theme agree. Leave <code>theme.light.css<\u002Fcode> (deprecated) untouched.<\u002Fp>\n<h3>3. Glossary term → pink fill, ink text, pink dotted underline<\u002Fh3>\n<p>Today <code>--st-glossary-annotation-color<\u002Fcode> (pink) drives both text and underline on a lime fill: 1.79 light, 3.29 dark.<\u002Fp>\n<div class=\"tw\"><table><thead><tr><th>Token<\u002Fth><th>Current<\u002Fth><th>New<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td>light <code>--st-glossary-annotation-bg<\u002Fcode><\u002Ftd><td><code>color-mix(in srgb, var(--st-color-lime-200) 45%, transparent)<\u002Fcode><\u002Ftd><td><code>var(--st-color-pink-50)<\u002Fcode><\u002Ftd><\u002Ftr><tr><td>dark <code>--st-glossary-annotation-bg<\u002Fcode><\u002Ftd><td><code>var(--st-color-lime-200)<\u002Fcode><\u002Ftd><td><code>color-mix(in srgb, var(--st-color-pink) 14%, var(--st-color-midnight-800))<\u002Fcode><\u002Ftd><\u002Ftr><tr><td><code>tokens.css<\u002Fcode> base <code>--st-glossary-annotation-bg<\u002Fcode><\u002Ftd><td><code>var(--st-color-lime-200)<\u002Fcode><\u002Ftd><td><code>var(--st-color-pink-50)<\u002Fcode><\u002Ftd><\u002Ftr><tr><td><code>--st-glossary-annotation-fg<\u002Fcode> (new, tokens.css)<\u002Ftd><td>—<\u002Ftd><td><code>var(--st-color-text-default)<\u002Fcode> (ink on light, white on dark)<\u002Ftd><\u002Ftr><tr><td><code>--st-glossary-annotation-color<\u002Fcode><\u002Ftd><td><code>var(--st-color-pink)<\u002Fcode><\u002Ftd><td>unchanged; now drives the underline only<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p>Component: text <code>color<\u002Fcode> → <code>var(--st-glossary-annotation-fg)<\u002Fcode>; underline <code>dotted<\u002Fcode>, colour <code>var(--st-glossary-annotation-color)<\u002Fcode>, 1px, offset <code>var(--st-link-underline-offset)<\u002Fcode>. Result: 17.38 light, 14.53 dark.<\u002Fp>\n<h3>4. Glossary semantics<\u002Fh3>\n<ul><li>The trigger is a <code>&lt;button type=\"button\"&gt;<\u002Fcode> (or <code>&lt;a&gt;<\u002Fcode> if it navigates), never a bare span.<\u002Fli><li><code>aria-expanded<\u002Fcode> + <code>aria-controls<\u002Fcode> when the popover opens.<\u002Fli><li>The popover meets 1.4.13: dismissible with Esc without moving focus, hoverable, and stays open until dismissed.<\u002Fli><li>On the term's own glossary entry page, wrap the term in <code>&lt;dfn&gt;<\u002Fcode>.<\u002Fli><\u002Ful>\n<h3>5. Citation semantics and size<\u002Fh3>\n<ul><li>Marker link: <code>aria-label=\"Citation N\"<\u002Fcode> (keep the visible <code>[N]<\u002Fcode>), <code>role=\"doc-noteref\"<\u002Fcode>, <code>id=\"cite-ref-N\"<\u002Fcode>.<\u002Fli><li>Notes sit in <code>role=\"doc-endnotes\"<\u002Fcode>. Each note gets a back-link <code>href=\"#cite-ref-N\"<\u002Fcode>, <code>aria-label=\"Back to citation N\"<\u002Fcode>, <code>role=\"doc-backlink\"<\u002Fcode>.<\u002Fli><li><code>--st-citation-size<\u002Fcode>: <code>0.72rem<\u002Fcode> → <code>0.75rem<\u002Fcode> (tokens.css).<\u002Fli><\u002Ful>\n<h3>6. Label size floor (tokens.css)<\u002Fh3>\n<div class=\"tw\"><table><thead><tr><th>Token<\u002Fth><th>Current<\u002Fth><th>New<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td><code>--st-label-size<\u002Fcode><\u002Ftd><td><code>0.65rem<\u002Fcode><\u002Ftd><td><code>0.6875rem<\u002Fcode><\u002Ftd><\u002Ftr><tr><td><code>--st-metadata-density-label-size<\u002Fcode><\u002Ftd><td><code>0.55rem<\u002Fcode><\u002Ftd><td><code>0.6875rem<\u002Fcode><\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>\n<p>Card CSS also hard-codes <code>0.65rem<\u002Fcode> (<code>.folioStatus<\u002Fcode>, <code>.statusBadge<\u002Fcode>, <code>.chipGroupLabel<\u002Fcode>, <code>.compact<\u002Fcode> footer/date/folio) and <code>0.68rem<\u002Fcode> (<code>.compact .eyebrow<\u002Fcode>). Repoint each to <code>var(--st-label-size)<\u002Fcode>. Check card footers and IndexCell for wrapping at 320px.<\u002Fp>\n<h3>7. Focus ring (verify only)<\u002Fh3>\n<p>Keep <code>2px solid var(--st-color-focus)<\u002Fcode>, 2px offset. Verify it shows against the pink-600 primary button (via the offset gap) and on canvas in both themes. No code change expected.<\u002Fp>\n<h3>8. Documentation resync<\u002Fh3>\n<ul><li>Tactical Guide: pink-500 is <code>#FF247D<\u002Fcode> (not <code>#FF69B4<\u002Fcode>); brand-secondary is maroon.<\u002Fli><li>theme.pink-moon.css comment: neutral-500 is <code>#6C6C6F<\u002Fcode> (the comment says <code>#7A7A7D<\u002Fcode>).<\u002Fli><li>Mark SUG-211 Option E as superseded by this epic in the code-inline and glossary token comments.<\u002Fli><li>Add to the Guide, in token terms:<\u002Fli><li>Pink is the one hot colour; everything else is neutral.<\u002Fli><li>Small pink text on light uses <code>--st-color-text-brand<\u002Fcode>. White on pink sits on <code>--st-color-pink-600<\u002Fcode> (hover pink-700).<\u002Fli><li>Dark eyebrows and folio labels use <code>--st-color-text-default<\u002Fcode>.<\u002Fli><li>Chips are neutral. Status dots are pink; draft is a ring.<\u002Fli><li>Rich text uses pink and maroon only. Lime is the secondary button fill and nothing else.<\u002Fli><\u002Ful>\n<h2>Technical Constraints<\u002Fh2>\n<ul><li>Token-only rule: no raw hex in component CSS.<\u002Fli><li>No schema or GROQ changes. If required, stop and flag.<\u002Fli><li>Zero radius everywhere; no new shadows.<\u002Fli><\u002Ful>\n<h2>Acceptance Criteria<\u002Fh2>\n<ul class=\"check\"><li class=\"open\"><span class=\"box\"><\u002Fspan><span><code>pnpm validate:tokens --strict-colors<\u002Fcode> passes.<\u002Fspan><\u002Fli><li class=\"open\"><span class=\"box\"><\u002Fspan><span>In a prose sample with all four marks, each is distinguishable in greyscale (<code>filter: grayscale(1)<\u002Fcode>), both themes.<\u002Fspan><\u002Fli><li class=\"open\"><span class=\"box\"><\u002Fspan><span>Inline code text vs fill ≥ 5.47 light, ≥ 6.66 dark.<\u002Fspan><\u002Fli><li class=\"open\"><span class=\"box\"><\u002Fspan><span>Glossary text vs fill ≥ 17.38 light, ≥ 14.53 dark.<\u002Fspan><\u002Fli><li class=\"open\"><span class=\"box\"><\u002Fspan><span>grep finds no <code>lime<\u002Fcode> or <code>seafoam<\u002Fcode> in <code>--st-code-inline-*<\u002Fcode> or <code>--st-glossary-*<\u002Fcode> values.<\u002Fspan><\u002Fli><li class=\"open\"><span class=\"box\"><\u002Fspan><span>Glossary trigger: reachable by Tab, opens on Enter/Space, closes on Esc, focus returns to the trigger, and the popover stays open when the pointer moves onto it.<\u002Fspan><\u002Fli><li class=\"open\"><span class=\"box\"><\u002Fspan><span>VoiceOver or NVDA announces markers as \"Citation 1, link\"; the back-link returns focus to the marker.<\u002Fspan><\u002Fli><li class=\"open\"><span class=\"box\"><\u002Fspan><span>Labels compute to 11px; no new wrapping in card footers at 320px.<\u002Fspan><\u002Fli><li class=\"open\"><span class=\"box\"><\u002Fspan><span>Docs merged; grep finds no <code>#FF69B4<\u002Fcode>.<\u002Fspan><\u002Fli><li class=\"open\"><span class=\"box\"><\u002Fspan><span>Route smoke test: one article with citations, glossary terms and inline code, one knowledge-graph node, both themes.<\u002Fspan><\u002Fli><\u002Ful>\n<h2>Assumptions standing in for PRD<\u002Fh2>\n<ul><li>Glossary popover content is already available client-side.<\u002Fli><li>Superseding SUG-211 Option E is accepted (decided 10 Oct, v4).<\u002Fli><\u002Ful>\n<h2>Post-Epic Close-Out<\u002Fh2>\n<ol><li><code>git status<\u002Fcode> must show nothing staged or unstaged<\u002Fli><li>Run <code>/mini-release EPIC-XXXX [Epic name]<\u002Fcode> or <code>/release<\u002Fcode> for MINOR version bumps<\u002Fli><li>Start next epic only after mini-release commit is confirmed<\u002Fli><\u002Fol><\u002Fmain><\u002Fbody><\u002Fhtml>"
