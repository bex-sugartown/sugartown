  <rect x="356" y="150" width="96" height="64" fill="#ffffff" stroke="#ff247d" stroke-width="1.5"/>
  <text x="404" y="172" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0d1226">IMPLEMEN-</text>
  <text x="404" y="184" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0d1226">TATION</text>
  <text x="404" y="200" font-size="7.5" text-anchor="middle" fill="#ff247d">reviewer unwired</text>
  <rect x="430" y="143" width="20" height="14" fill="#ff247d"/>
  <text x="440" y="153" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#f8f8fa">L6</text>

