<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="'Courier Prime','Courier New',monospace">
  <defs>
    <marker id="mInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d1226"/>
    </marker>
    <marker id="mPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff247d"/>
    </marker>
  </defs>

  <rect width="920" height="440" fill="#f8f8fa"/>

  <text x="32" y="40" font-size="10" letter-spacing="1.5" fill="#ff247d">EPIC LIFECYCLE · VERIFIED AGAINST THE REPO, 2026-07-24</text>
  <text x="32" y="72" font-size="26" font-family="'EB Garamond',Georgia,'Times New Roman',serif" fill="#0d1226">Eight phases, three enforcement gaps</text>
  <text x="32" y="94" font-size="10.5" fill="#0d1226" fill-opacity="0.65">Pink markers are tracked, not hypothetical — each maps to an open Linear epic</text>

  <!-- ═══ 8 phase boxes ═══ -->
  <!-- box geometry: x start 32, width 96, gap 12, step 108, y 150, h 64 -->
  <!-- L-badge geometry: 20×14 tab, top-right corner of each box, y overlaps box top edge by 7px -->

  <!-- 1 Intake — L1 Inventory -->
  <rect x="32" y="150" width="96" height="64" fill="#ffffff" stroke="#0d1226"/>
  <text x="80" y="176" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0d1226">INTAKE</text>
  <text x="80" y="198" font-size="8" text-anchor="middle" fill="#0d1226" fill-opacity="0.6">optional</text>
  <rect x="106" y="143" width="20" height="14" fill="#0d1226"/>
  <text x="116" y="153" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#f8f8fa">L1</text>

  <!-- 2 Planning — L5 Human Oversight -->
  <rect x="140" y="150" width="96" height="64" fill="#ffffff" stroke="#0d1226"/>
  <text x="188" y="176" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0d1226">PLANNING</text>
  <text x="188" y="198" font-size="8" text-anchor="middle" fill="#0d1226" fill-opacity="0.6">Linear-first</text>
  <rect x="214" y="143" width="20" height="14" fill="#0d1226"/>
  <text x="224" y="153" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#f8f8fa">L5</text>

  <!-- 3 Design — L5 Human Oversight -->
  <rect x="248" y="150" width="96" height="64" fill="#ffffff" stroke="#0d1226"/>
  <text x="296" y="176" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0d1226">DESIGN</text>
  <text x="296" y="198" font-size="8" text-anchor="middle" fill="#0d1226" fill-opacity="0.6">Phase 0 gate</text>
  <rect x="322" y="143" width="20" height="14" fill="#0d1226"/>
  <text x="332" y="153" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#f8f8fa">L5</text>

