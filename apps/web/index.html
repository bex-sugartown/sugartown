<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sugartown Digital</title>
    <meta name="description" content="Product Management for CMS, design systems, and e-commerce. Ex-Sephora, Estée Lauder. Currently shipping a portfolio site built like an enterprise platform." />
    <!-- Google Analytics loads from the app bundle only after consent: src/lib/consent.js (SUG-202) -->
    <!-- Google Fonts: authoritative <link> for Ledger Tradition (AB-001) font stack.
         Cormorant Garamond (headings/narrative), DM Sans (body/UI), IBM Plex Mono (mono labels).
         <link rel="stylesheet"> is loaded in parallel with JS, earlier than CSS @import. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Hidden form for Netlify deploy-time detection (SPA pattern) -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" data-netlify-recaptcha="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <!-- Theme init: read persisted preference before first paint to avoid FOUC -->
    <!-- Pink Moon is the primary DS identity. Default: light-pink-moon. -->
    <script>
      (function () {
        var t = localStorage.getItem('st-theme')
        var valid = ['light-pink-moon', 'dark-pink-moon']
        document.documentElement.setAttribute(
          'data-theme',
          valid.indexOf(t) !== -1 ? t : 'light-pink-moon'
        )
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
