<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="'Courier Prime','Courier New',monospace">
  <defs>
    <marker id="mInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d1226"/>
    </marker>
    <marker id="mPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff247d"/>
    </marker>
  </defs>

  <rect width="880" height="500" fill="#f8f8fa"/>

  <text x="32" y="40" font-size="10" letter-spacing="1.5" fill="#ff247d">AI RUNS THE WORK · A HUMAN SHIPS IT</text>
  <text x="32" y="70" font-size="26" font-family="'EB Garamond',Georgia,'Times New Roman',serif" fill="#0d1226">The governed AI operating model</text>

  <!-- caucus -->
  <rect x="32" y="130" width="210" height="220" fill="#ffffff" stroke="#0d1226"/>
  <text x="48" y="154" font-size="10" letter-spacing="1.2" fill="#0d1226" fill-opacity="0.55">AGENTIC CAUCUS</text>
  <text x="48" y="184" font-size="18" font-family="'EB Garamond',Georgia,'Times New Roman',serif" fill="#0d1226">AI agents</text>
  <text x="48" y="208" font-size="10" fill="#0d1226" fill-opacity="0.7">Claude + Claude Code</text>
  <text x="48" y="224" font-size="10" fill="#0d1226" fill-opacity="0.7">product · engineering</text>
  <text x="48" y="240" font-size="10" fill="#0d1226" fill-opacity="0.7">design · content drafts</text>

  <!-- guardrails -->
  <rect x="302" y="110" width="320" height="260" fill="#ffffff" stroke="#0d1226"/>
  <text x="318" y="134" font-size="10" letter-spacing="1.2" fill="#0d1226" fill-opacity="0.55">RISK-TIERED GUARDRAILS</text>
  <text x="318" y="150" font-size="9.5" fill="#0d1226" fill-opacity="0.6">gates scale with blast radius</text>

  <text x="318" y="183" font-size="10.5" font-weight="bold" fill="#0d1226">A · AUTONOMOUS</text>
  <text x="318" y="199" font-size="9" fill="#0d1226" fill-opacity="0.65">low-risk work · async human review</text>
  <rect x="542" y="172" width="66" height="16" fill="none" stroke="#0d1226" stroke-opacity="0.45"/>
  <text x="575" y="183" font-size="7.5" text-anchor="middle" fill="#0d1226" fill-opacity="0.65">CONVENTION</text>
  <line x1="310" y1="212" x2="614" y2="212" stroke="#d5d9ee"/>

  <text x="318" y="233" font-size="10.5" font-weight="bold" fill="#0d1226">B · GATED EXECUTION</text>
  <text x="318" y="249" font-size="9" fill="#0d1226" fill-opacity="0.65">epic gates · Phase 0 mock · visual QA</text>
  <rect x="542" y="222" width="66" height="16" fill="none" stroke="#0d1226" stroke-opacity="0.45"/>
  <text x="575" y="233" font-size="7.5" text-anchor="middle" fill="#0d1226" fill-opacity="0.65">CONVENTION</text>
  <line x1="310" y1="262" x2="614" y2="262" stroke="#d5d9ee"/>

  <text x="318" y="283" font-size="10.5" font-weight="bold" fill="#0d1226">C · PROPOSAL REQUIRED</text>
  <text x="318" y="299" font-size="9" fill="#0d1226" fill-opacity="0.65">Content Write Gate · approve, then write</text>
  <rect x="542" y="272" width="66" height="16" fill="none" stroke="#0d1226" stroke-opacity="0.45"/>
  <text x="575" y="283" font-size="7.5" text-anchor="middle" fill="#0d1226" fill-opacity="0.65">CONVENTION</text>
  <line x1="310" y1="312" x2="614" y2="312" stroke="#d5d9ee"/>

  <text x="318" y="333" font-size="10.5" font-weight="bold" fill="#0d1226">D · HUMAN ONLY</text>
  <text x="318" y="349" font-size="9" fill="#0d1226" fill-opacity="0.65">publish + destructive ops stay human</text>
  <rect x="548" y="322" width="60" height="16" fill="none" stroke="#ff247d"/>
  <text x="578" y="333" font-size="7.5" text-anchor="middle" fill="#ff247d">ENFORCED</text>

  <!-- human -->
  <rect x="682" y="130" width="166" height="220" fill="#ffffff" stroke="#0d1226"/>
  <text x="698" y="154" font-size="10" letter-spacing="1.2" fill="#0d1226" fill-opacity="0.55">HUMAN</text>
  <text x="698" y="186" font-size="18" font-family="'EB Garamond',Georgia,'Times New Roman',serif" fill="#0d1226">Adjudicates</text>
  <text x="698" y="208" font-size="18" font-family="'EB Garamond',Georgia,'Times New Roman',serif" fill="#0d1226">and publishes</text>
  <text x="698" y="234" font-size="9.5" fill="#0d1226" fill-opacity="0.7">every architectural call</text>
  <text x="698" y="250" font-size="9.5" fill="#0d1226" fill-opacity="0.7">every publish</text>

  <!-- flow arrows -->
  <line x1="242" y1="240" x2="296" y2="240" stroke="#0d1226" marker-end="url(#mInk)"/>
  <line x1="622" y1="240" x2="676" y2="240" stroke="#0d1226" marker-end="url(#mInk)"/>
  <line x1="765" y1="350" x2="765" y2="388" stroke="#ff247d" stroke-width="2" marker-end="url(#mPink)"/>
  <rect x="735" y="394" width="60" height="24" fill="none" stroke="#ff247d"/>
  <text x="765" y="410" font-size="11" text-anchor="middle" fill="#ff247d">LIVE</text>

  <!-- structural guarantee -->
  <text x="32" y="448" font-size="10">
    <tspan fill="#ff247d">STRUCTURAL GUARANTEE</tspan>
    <tspan fill="#0d1226"> · nothing goes live without a human: Sanity's draft/publish split enforces it</tspan>
  </text>
  <text x="32" y="474" font-size="9" fill="#0d1226" fill-opacity="0.6">ENFORCED · platform or code makes it true&#160;&#160;&#160;&#160;CONVENTION · documented rule the agents follow (CLAUDE.md + risk tiers)</text>
</svg>
