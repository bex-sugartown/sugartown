# netlify.toml — Sugartown Storybook (pinkmoon.sugartown.io)
#
# Separate Netlify site for the design system reference.
# Deployment:
#   1. Create a new site in the Netlify dashboard
#   2. Leave base directory BLANK in the dashboard — the ignore script is the gate
#   3. Build command: (leave blank — netlify.toml provides it)
#   4. Publish directory: (leave blank — netlify.toml provides it)
#   5. Add custom domain: pinkmoon.sugartown.io
#
# Why no base directory: Netlify's base-directory pre-check cancels builds before
# the ignore script runs. Story changes often land in packages/design-system/ or
# apps/web/src/design-system/ — not apps/storybook/ directly. Without base set,
# every push reaches the ignore script, which correctly decides whether to build.

[build]
  command = "pnpm install --frozen-lockfile && cd apps/storybook && pnpm storybook:build"
  publish = "apps/storybook/storybook-static"
  # Rebuild when Storybook config, DS package, or web DS adapter changes.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/storybook/ packages/design-system/ apps/web/src/design-system/"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "9.1.0"

# SPA fallback — Storybook uses client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
