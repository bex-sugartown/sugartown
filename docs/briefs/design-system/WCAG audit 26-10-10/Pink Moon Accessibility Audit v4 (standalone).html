document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 /* SUG-140: quiet lateral edge on dark */\n\n  /* ── FilterStrip chip color system — light overrides (SUG-105) ─ */\n  --st-kg-chip-all-bg:          var(--st-color-ink);\n  --st-kg-chip-all-fg:          var(--st-color-neutral-100);\n  --st-kg-chip-all-border:      transparent;\n  --st-kg-chip-article-bg:      var(--st-color-seafoam-50);\n  --st-kg-chip-article-fg:      var(--st-color-seafoam-800);\n  --st-kg-chip-article-border:  color-mix(in srgb, var(--st-color-seafoam-500) 35%, transparent);\n  --st-kg-chip-case-bg:         color-mix(in srgb, var(--st-color-pink) 8%, transparent);\n  --st-kg-chip-case-fg:         var(--st-color-pink);\n  --st-kg-chip-case-border:     color-mix(in srgb, var(--st-color-pink) 35%, transparent);\n  --st-kg-chip-node-bg:         var(--st-color-ink);\n  --st-kg-chip-node-fg:         var(--st-color-neutral-100);\n  --st-kg-chip-node-border:     transparent;\n\n  /* Button ghost tertiary — light theme: signal is brand pink (dark theme keeps base lime) */\n  --st-button-tertiary-border:  var(--st-color-brand-primary);\n  --st-button-tertiary-text:    var(--st-color-brand-primary);\n}\n\n/* ══════════════════════════════════════════════════════════\n   DARK PINK MOON\n   ══════════════════════════════════════════════════════════ */\n:root[data-theme~=\"dark-pink-moon\"],\n[data-theme~=\"dark-pink-moon\"] {\n\n  /* Surface — subtle separation on dark canvas */\n  --st-color-bg-surface:        rgba(255, 255, 255, 0.06);\n  --st-color-bg-surface-strong: rgba(255, 255, 255, 0.10);\n  /* Tile/stat surfaces — solid dark; glassmorphism is wrong for data grids */\n  --st-icon-button-bg:          var(--st-color-midnight-700);\n  --st-stat-tile-bg:            var(--st-color-midnight-700);\n  --st-tile-bg:                 var(--st-color-midnight-700);\n  /* Wrap border — dark hairline divider between tiles (was neutral-400 #a3a3a3) */\n  --st-color-border-wrap:       var(--st-color-border-default);\n\n  /* Borders */\n  --st-color-border-default: fg:      var(--st-color-pink);\n  --st-chip-dot-evergreen:  var(--st-color-lime);\n  --st-chip-dot-validated:  var(--st-color-seafoam);\n  --st-chip-dot-exploring:  var(--st-color-amber);\n  --st-chip-dot-deprecated: var(--st-color-softgrey-500);\n\n  /* MetadataCard V2 Inverted Well — dark overrides (SUG-88) */\n  --st-metadata-label-bg:  var(--st-color-midnight-900);\n  --st-metadata-body-bg:   var(--st-color-midnight-700);\n\n  /* Table zone tokens — dark overrides (SUG-119)\n   * IMPORTANT: subdued header uses midnight-700 (opaque), NOT --st-color-bg-surface-strong\n   * which resolves to rgba(255,255,255,0.10) — a glassmorphism wash — in this dark block.\n   * Cascade audit: accent header stays pink (unchanged), subdued header = solid dark surface.\n   */\n  --st-table-header-bg-accent:        var(--st-color-pink);           /* unchanged — pink is correct in dark */\n  --st-table-header-color-accent:     var(--st-color-white);\n  --st-table-header-bg-subdued:       var(--st-color-midnight-700);   /* #1c2240 — opaque, no glassmorphism */\n  --st-table-header-color-subdued:    var(--st-color-text-muted);\n  --st-table-row-hover-bg:            color-mix(in srgb, var(--st-color-pink) 4%, transparent);\n\n  /* Inline code — SUG-211 Option E: recessive solid midnight (no glassmorphism), seafoam text,\n     darker seafoam outline (recedes against the dark page — opposite direction from light) */\n  --st-code-inline-bg:          var(--st-color-midnight-700);\n  --st-code-inline-color:       var(--st-color-seafoam-500);\n  --st-code-inline-text:        var(--st-color-seafoam-500);\n  --st-code-inline-border:      1px solid var(--st-color-seafoam-700);\n\n  /* Inline glossary-term annotation trigger — SUG-211 Option E: solid lime-200 (not a tint,\n     so it reads on the dark canvas the way light-mode code always got a solid fill) */\n  --st-glossary-annotation-bg:  var(--st-color-lime-200);\n\n  /* IndexCell — inactive state on dark canvas */\n  --st-index-cell-inactive-color: rgba(255, 255, 255, 0.18);\n\n  /* Card hover — match light-pink-moon: pink border, no lift, no shadow */\n  --st-card-hover-border:       var(--st-color-pink);\n  --st-card-hover-translate-y:  0px;\n  --st-card-hover-shadow:       none;\n\n  /* ── Site graph — dark theme (mirrors light block; canvas is always dark) ─ */\n  --st-graph-bg:              var(--st-color-midnight-800);\n  --st-graph-edge-membership: var(--st-color-white-20);\n  --st-graph-edge-lateral:    var(--st-color-white-15);\n  --st-kg-node-article:       var(--st-color-seafoam-700);\n  --st-kg-node-case:          var(--st-color-maroon-400);\n  --st-kg-node-node:          var(--st-color-lime-400);\n  --st-kg-node-project:       var(--st-color-pink);\n  --st-kg-node-category:      var(--st-color-softgrey-300);\n  --st-kg-edge-member:        var(--st-color-white-20);\n  --st-kg-edge-lateral:       var(--st-color-white-15);\n  --st-kg-legend-bg:          var(--st-color-midnight-700);\n  --st-kg-legend-border:      var(--st-color-white-15);\n  --st-kg-legend-color:       var(--st-color-softgrey-400);\n  --st-kg-legend-dot-outline-border: var(--st-color-softgrey-400);\n  --st-graph-node-category:   var(--st-color-softgrey-300);\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#f2f2f3;}\na{color:var(--st-color-maroon);text-decoration:underline;text-decoration-color:var(--st-color-pink);text-underline-offset:2px;}\na:hover{text-decoration-thickness:2px;}\n<\u002Fstyle>\n\n<\u002Fhelmet>\n<div style=\"background:var(--st-color-neutral-100);min-height:100vh;padding:56px 24px 96px;\">\n<div style=\"max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:64px;\">\n\n<header data-theme=\"light-pink-moon\" data-screen-label=\"Header\" style=\"display:flex;flex-direction:column;gap:16px;max-width:760px;background:transparent;\">\n  <div style=\"display:flex;align-items:center;gap:10px;font-family:var(--st-font-family-mono);font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--st-color-text-brand);\"><span style=\"width:16px;height:2px;background:var(--st-color-pink);\"><\u002Fspan>Audit v4 · 10 Oct 2026 · WCAG 2.2 AA<\u002Fdiv>\n  <h1 style=\"margin:0;font-family:var(--st-font-family-narrative);font-size:52px;font-weight:600;line-height:1.1;color:var(--st-color-ink);text-wrap:pretty;\">Pink Moon after Pass 1 and Pass 2: neutral chips, pink rich text<\u002Fh1>\n  <p style=\"margin:0;font-family:var(--st-font-family-ui);font-size:18px;line-height:1.6;color:var(--st-color-text-secondary);text-wrap:pretty;\">Rebuilt from the canonical snapshot of 7 Oct. This page loads the real <code style=\"font-family:var(--st-font-family-mono);font-size:0.85em;\">tokens.css<\u002Fcode> and <code style=\"font-family:var(--st-font-family-mono);font-size:0.85em;\">theme.pink-moon.css<\u002Fcode>, and each specimen copies the component CSS rule for rule. The right-hand panels show the approved direction (10 Oct), applied as token overrides on the panel. They change only what Pass 1 and Pass 2 list.<\u002Fp>\n  <p style=\"margin:0;font-family:var(--st-font-family-ui);font-size:18px;line-height:1.6;color:var(--st-color-ink);text-wrap:pretty;\">Pink is the one hot colour. Where it would be small text on light it steps to maroon (<code style=\"font-family:var(--st-font-family-mono);font-size:0.85em;\">--st-color-text-brand<\u002Fcode>), and white labels sit on pink-600. v4 goes further than v3: every chip is neutral, the four rich-text marks are pink or maroon only (no lime, no seafoam), and on dark the eyebrow and folio label go white. Lime stays on the secondary button.<\u002Fp>\n<\u002Fheader>\n\n<section id=\"specimens\" data-screen-label=\"Specimens\" style=\"display:flex;flex-direction:column;gap:24px;\">\n  <div data-theme=\"light-pink-moon\" style=\"display:flex;flex-direction:column;gap:8px;max-width:760px;background:transparent;\">\n    <span style=\"font-family:var(--st-font-family-mono);font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--st-color-text-brand);\">01 · Specimens<\u002Fspan>\n    <h2 style=\"margin:0;font-family:var(--st-font-family-narrative);font-size:36px;font-weight:600;color:var(--st-color-ink);\">Canonical today, and the v4 direction<\u002Fh2>\n    <p style=\"margin:0;font-family:var(--st-font-family-ui);font-size:15px;line-height:1.6;color:var(--st-color-text-secondary);text-wrap:pretty;\">Prose with the four inline marks, a folio card, chips, buttons, a segmented control and an accent table. Hover the buttons to see the hover step.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:24px;\">\n\n    <div data-theme=\"light-pink-moon\" style=\"--m-primary-bg:var(--st-color-brand-primary);--m-primary-hover:var(--st-color-pink-600);--m-seg:var(--st-color-brand-primary);--m-note-link:var(--st-color-brand-primary);--m-chip-pink:var(--st-color-pink);--m-chip-seafoam:var(--st-color-seafoam-700);--m-gl-fg:var(--st-glossary-annotation-color);--m-gl-style:solid;--m-link-deco:currentColor;--m-code-size:0.85em;--m-code-pad:0.2em 0.5em;--m-code-radius:4px;--m-code-ws:normal;--m-cite-size:var(--st-citation-size);background:var(--st-color-bg-canvas);border:1px solid var(--st-color-rule-accent);padding:24px;display:flex;flex-direction:column;gap:20px;\">\n      <div style=\"display:flex;justify-content:space-between;gap:12px;font-family:var(--st-font-family-mono);font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--st-color-text-default);\"><span>Light · canonical today<\u002Fspan><span>13 fail<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;\">\n        <p style=\"margin:0;font-family:var(--st-font-family-ui);font-size:var(--st-font-size-base);line-height:1.7;color:var(--st-color-text-default);\">Token governance <a href=\"#specimens\" style=\"color:var(--st-color-link-default);text-decoration-line:u -font-family-narrative);font-size:36px;font-weight:600;color:var(--st-color-ink);\">Every failing pair, canonical value and fix<\u002Fh2>\n    <p style=\"margin:0;font-family:var(--st-font-family-ui);font-size:15px;line-height:1.6;color:var(--st-color-text-secondary);text-wrap:pretty;\">Computed from the canonical token values. Tinted backgrounds are resolved over the surface beneath them. Dots are non-text and need 3:1; everything else is small text and needs 4.5:1.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;border-top:1px solid var(--st-color-ink);\">\n    <div style=\"display:grid;grid-template-columns:minmax(0,1.8fr) 56px minmax(0,1.2fr) minmax(0,1.5fr) 44px;gap:12px;padding:10px 0;border-bottom:1px solid var(--st-color-ink);font-family:var(--st-font-family-mono);font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--st-color-ink);\"><span>Element<\u002Fspan><span>Theme<\u002Fspan><span>Canonical<\u002Fspan><span>After<\u002Fspan><span>Pass<\u002Fspan><\u002Fdiv>\n    <sc-for list=\"{{ pairs }}\" as=\"r\" hint-placeholder-count=\"8\">\n      <div style=\"display:grid;grid-template-columns:minmax(0,1.8fr) 56px minmax(0,1.2fr) minmax(0,1.5fr) 44px;gap:12px;padding:10px 0;border-bottom:1px solid var(--st-color-rule-accent);align-items:center;\">\n        <span style=\"font-family:var(--st-font-family-ui);font-size:14px;line-height:1.4;color:var(--st-color-ink);\">{{ r.el }}<\u002Fspan>\n        <span style=\"font-family:var(--st-font-family-mono);font-size:11px;color:var(--st-color-neutral-600);text-transform:uppercase;letter-spacing:0.06em;\">{{ r.theme }}<\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\"><span style=\"font-family:var(--st-font-family-mono);font-size:12px;font-weight:600;padding:4px 8px;background:{{ r.cbg }};color:{{ r.cfg }};border:1px solid var(--st-color-rule-accent);\">Aa<\u002Fspan><span style=\"font-family:var(--st-font-family-mono);font-size:12px;color:var(--st-color-ink);\">{{ r.cr }}<\u002Fspan><\u002Fspan>\n        <span style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\"><span style=\"font-family:var(--st-font-family-mono);font-size:12px;font-weight:600;padding:4px 8px;background:{{ r.pbg }};color:{{ r.pfg }};border:1px solid var(--st-color-rule-accent);\">Aa<\u002Fspan><span style=\"font-family:var(--st-font-family-mono);font-size:12px;color:var(--st-color-ink);\">{{ r.pr }}<\u002Fspan><span style=\"font-family:var(--st-font-family-mono);font-size:11px;color:var(--st-color-neutral-600);\">{{ r.pname }}<\u002Fspan><\u002Fspan>\n        <span style=\"font-family:var(--st-font-family-mono);font-size:11px;font-weight:700;color:var(--st-color-ink);\">{{ r.pass }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"scope\" data-theme=\"light-pink-moon\" data-screen-label=\"Scope\" style=\"display:flex;flex-direction:column;gap:16px;background:transparent;\">\n  <div style=\"display:flex;flex-direction:column;gap:8px;max-width:760px;\">\n    <span style=\"font-family:var(--st-font-family-mono);font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--st-color-text-brand);\">03 · Where it lands<\u002Fspan>\n    <h2 style=\"margin:0;font-family:var(--st-font-family-narrative);font-size:36px;font-weight:600;color:var(--st-color-ink);\">Two epics and one issue<\u002Fh2>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));border:1px solid var(--st-color-ink);background:var(--st-color-white);\">\n    <div style=\"padding:20px;border-right:1px solid var(--st-color-rule-accent);display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--st-font-family-mono);font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--st-color-ink);\">Pass 1 · Token contrast<\u002Fspan><p style=\"margin:0;font-family:var(--st-font-family-ui);font-size:14px;line-height:1.6;color:var(--st-color-text-secondary);text-wrap:pretty;\">White on pink-600. Small pink text on light to maroon. Dark eyebrow and folio label to text-default. Chips to the neutral tag chassis; status dots pink. Inline code reads its tokens. Reduced motion.<\u002Fp><\u002Fdiv>\n    <div style=\"padding:20px;border-right:1px solid var(--st-color-rule-accent);display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--st-font-family-mono);font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--st-color-ink);\">Pass 2 · Inline marks<\u002Fspan><p style=\"margin:0;font-family:var(--st-font-family-ui);font-size:14px;line-height:1.6;color:var(--st-color-text-secondary);text-wrap:pretty;\">Prose links underlined in pink. Glossary: pink-50 fill, ink text, pink dotted underline. Inline code: maroon on grey with a maroon-200 outline (pink-300 on dark). Glossary and citation semantics. Size floors. Docs resync.<\u002Fp><\u002Fdiv>\n    <div style=\"padding:20px;display:flex;flex-direction:column;gap:10px;\"><span style=\"font-family:var(--st-font-family-mono);font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--st-color-ink);\">Leftovers · Decisions<\u002Fspan><p style=\"margin:0;font-family:var(--st-font-family-ui);font-size:14px;line-height:1.6;color:var(--st-color-text-secondary);text-wrap:pretty;\">Bold threshold. Hero eyebrow. Knowledge-graph filter chips. Retire chip presets. Legacy status badge colours. Dark label strip. Sidebar duplication bug.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showRatios&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Specimen&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const P = [\n      ['Primary button label','Both','#ff247d','#ffffff','3.62','#e00069','#ffffff','4.80','pink-600'],\n      ['Accent table header label','Both','#ff247d','#ffffff','3.62','#e00069','#ffffff','4.80','pink-600'],\n      ['Link, citation marker, tertiary button, segmented active on canvas','Light','#f2f2f3','#ff247d','3.24','#f2f2f3','#b91c68','5.47','text-brand'],\n      ['Card eyebrow on card','Light','#ffffff','#ff247d','3.62','#ffffff','#b91c68','6.12','text-brand'],\n      ['Card eyebrow on label strip','Light','#e4e4e5','#ff247d','2.85','#e4e4e5','#b91c68','4.82','text-brand'],\n      ['Knowledge-graph case chip','Light','#f3e2ea','#ff247d','2.72','#f3e2ea','#b91c68','4.61','text-brand'],\n      ['Glossary term','Light','#eef8c4','#ff247d','1.79','#fff0f6','#0a0f1a','17.38','ink on pink-50'],\n      ['Inline code','Light','#f1f2f4','#15735c','5.15','#f1f2f4','#b91c68','5.47','text-brand on softgrey-100'],\n      ['Chip presets: pink, seafoam, lime, amber, violet','Light','#ffffff','#ff247d','2.72–3.70','#ffffff','#0a0f1a','19.16','neutral tag chip'],\n      ['Status dots: draft, evergreen, operationalized (non-text)','Light','#ffffff','#2bd4aa','1.89–2.72','#ffffff','#ff247d','3.62','pink, ring for draft'],\n      ['Card eyebrow on card','Dark','#1c2033','#ff247d','4.45','#1c2033','#f8f8fa','15.19','text-default'],\n      ['Chip preset: pink','Dark','#1d1b31','#ff247d','4.09','#1c2240','#e1e3e6','12.08','neutral tag chip'],\n      ['Folio badge label on label strip','Dark','#141830','#6e7f96','4.27','#141830','#f8f8fa','16.46','text-default'],\n      ['Glossary term','Dark','#e8ff8a','#ff247d','3.29','#351a3b','#f8f8fa','14.53','text-default on 14% pink'],\n      ['Inline code','Dark','#1c2240','#2bd4aa','8.21','#1c2240','#ff80b5','6.66','pink-300 on midnight-700']\n    ];\n    const pairs = P.map(p => ({ el:p[0], theme:p[1], cbg:p[2], cfg:p[3], cr:p[4], pbg:p[5], pfg:p[6], pr:p[7], pname:p[8], pass: (p[0].startsWith('Glossary') || p[0].startsWith('Inline code')) ? '2' : '1' }));\n    return { pairs, showRatios: this.props.showRatios ?? true };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
