  <rect x="464" y="150" width="96" height="64" fill="#ffffff" stroke="#ff247d" stroke-width="1.5"/>
  <text x="512" y="176" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0d1226">VERIFICATION</text>
