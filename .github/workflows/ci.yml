name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Validate · Build
    runs-on: ubuntu-latest

    # Sanity content-API config for the validate:* steps below.
    #
    # These are deliberately NOT secrets. Every VITE_-prefixed variable is inlined into
    # the client bundle at build time, so all three already ship to every visitor's
    # browser; poalmzla is additionally hardcoded in apps/studio/sanity.config.ts and in
    # eight migration scripts. Storing public config in the secret store bought no
    # security and cost reviewability: on 2026-07-28, validate:taxonomy ran in CI for the
    # first time in its existence and reported 19 tag documents, 63 dangling tag refs and
    # 24 dangling author refs — against a project that has 64 tags, 0 dangling refs, and
    # exactly one person document. The values in the secret store had drifted from the
    # real project and nothing could see it, because a secret cannot be read back.
    #
    # Public config belongs in the repo where a diff can catch it. The genuine credential
    # (a write token) is not needed here: these validators read published content only,
    # which is the correct thing to gate on — CI should check what visitors actually see,
    # not the state of unpublished drafts.
    env:
      VITE_SANITY_PROJECT_ID: poalmzla
      VITE_SANITY_DATASET: production
      VITE_SANITY_API_VERSION: '2025-02-02'

      # No VITE_SANITY_TOKEN. Removed 2026-08-08 by SUG-260 Phase 3.
      #
      # 110 published documents used to carry WordPress-migration ids of the form
      # wp.<type>.<id>. Sanity reads dots as path segments and the dataset's public grant
      # covers path `*` (one segment), so every dotted id was invisible to anonymous
      # queries, and CI had to authenticate or it validated a view no visitor got. On
      # 2026-07-28 an unauthenticated run reported 63 dangling tag refs and 24 dangling
      # author refs that resolved perfectly well for every real reader.
      #
      # Those ids are now `<type>-<slug>`, so anonymous reads see the whole published
      # dataset and CI validates exactly what a visitor sees. Verified 2026-08-08:
      # `validate:taxonomy --no-token` and `validate:filters --no-token` both exit 0.
      #
      # Drafts are still `drafts.<id>` and therefore still invisible anonymously. That is
      # correct here: CI gates on published content, not on unpublished drafts.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Validate URLs
        run: pnpm validate:urls

      - name: Validate filters
        run: pnpm validate:filters

      - name: Validate taxonomy
        run: pnpm validate:taxonomy

      - name: Validate control register
        run: pnpm validate:controls

      # WARN-ONLY until the re-arm date on CTL-025 (SUG-281 Phase 1, decision A5).
      # Still runs, still reports; does not fail the run. It BLOCKS at
      # pre-commit, which is the reader that catches this while it is cheap.
      #
      # `continue-on-error` leaves the run conclusion `success`, so
      # ci-failure-alert.yml (which fires only on `conclusion == 'failure'`,
      # ci-failure-alert.yml:32) cannot read this gate at all. The follow-on
      # step below is therefore the ONLY CI-side artifact that this gate fired,
      # and `/eod` Phase 3 step 5b is its only reader (CTL-041, CTL-042).
      #
      # `outcome`, not `conclusion`: `outcome` is the step's result BEFORE
      # continue-on-error is applied and is the documented way to see through it.
      # The exit code of the script itself is untouched, so the liveness probe on
      # this gate stays valid — making the script exit 0 would have reported it
      # inert and taken validate:enforcement-liveness red.
      - name: Validate doc budget
        id: doc_budget
        run: pnpm validate:doc-budget
        continue-on-error: true

      - name: Warn-gate annotation — doc budget
        if: steps.doc_budget.outcome == 'failure'
        run: echo "::warning title=WARN-GATE::validate:doc-budget FAILED (warn-only until re-arm, CTL-025). The run still concludes success; this annotation is the only signal."

      - name: Validate governance diff-clean
        # Compares the committed governance.json against what governance/source/
        # produces. --ref HEAD because in CI the commit under test IS HEAD; the
        # pre-commit variant compares against the index instead.
        run: pnpm validate:governance-diff --ref HEAD

      - name: Validate governance
        # Schema, closed-world referential integrity, overdue reads, and the
        # outside-source scan. Wired here as well as at pre-commit deliberately:
        # validate:validators is satisfied by EITHER, so a pre-commit-only gate
        # would pass every meta-check while being invisible on `main` — and
        # merge commits run no pre-commit hook at all.
        run: pnpm validate:governance

      - name: Validate governance tally
        run: pnpm validate:governance-tally

      - name: Validate schema parity
        run: pnpm validate:schema-parity
        env:
          # Sanity CLI auth (schema list/manifest extract), NOT the VITE_SANITY_*
          # content API vars used above. The @sanity/cli package only reads the
          # token from an env var literally named SANITY_AUTH_TOKEN, so the repo
          # secret (named SANITY_SCHEMA_PARITY) is mapped to that name here.
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_SCHEMA_PARITY }}

      # WARN-ONLY until the re-arm date on CTL-024 (SUG-281 Phase 1, decision A5).
      # This one blocks NOWHERE while warn-only, and that is accepted, not
      # overlooked: it exits 0 as SKIPPED without LINEAR_API_KEY, so it has no
      # local reader to fall back on the way doc-budget does. The follow-on
      # annotation step plus `/eod` (CTL-041, CTL-042) is its ONLY reader.
      # Accepted because it caused two of the last three red runs on `main` and
      # has never caught a code defect; the re-arm date is what keeps it
      # temporary. See the doc-budget step above for why `outcome`, not
      # `conclusion`.
      - name: Validate epic docs
        id: epic_docs
        run: pnpm validate:epic-docs
        continue-on-error: true
        env:
          # Reuses the same repo secret the stats pipeline already authenticates
          # with (stats.yml). Missing key or an API failure is not a failure here —
          # collectLinear()'s graceful degradation makes this step SKIPPED (exit 0,
          # ::warning:: annotation), not a false pass. See scripts/validate-epic-docs.js.
          LINEAR_API_KEY: ${{ secrets.LINEAR_SUGARTOWN_STATS }}

      - name: Warn-gate annotation — epic docs
        if: steps.epic_docs.outcome == 'failure'
        run: echo "::warning title=WARN-GATE::validate:epic-docs FAILED (warn-only until re-arm, CTL-024). The run still concludes success; this annotation is the only signal."

      - name: Build
        run: pnpm build
        env:
          # apps/contentful-poc throws at module load without these
          # (src/lib/contentful.ts), so the whole build fails without them.
          # Latent until 2026-07-28: CI had never reached the Build step, because
          # it died at Lint or Typecheck on every run since 2026-05-10.
          #
          # These ARE secrets, unlike the VITE_SANITY_* config above. That config
          # is inlined into a client bundle and already public; this is a
          # server-side Contentful Content Delivery API key that never reaches a
          # browser (note the deliberate absence of a NEXT_PUBLIC_ prefix). It is
          # read-only and scoped to published content — the Content Management
          # token, which can write, is used only by migration scripts and must
          # never appear here.
          #
          # CONTENTFUL_ENVIRONMENT is omitted: the code already defaults to
          # "master", and a second way to say the same thing is a second thing to
          # keep in sync.
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Route smoke tests
        run: pnpm test:smoke
        env:
          CI: true

  liveness:
    name: Enforcement liveness
    runs-on: ubuntu-latest

    # Its own job, not a step in `ci`, for two reasons. It deliberately mutates
    # the working tree (that is the whole method — break a gate, prove it fails,
    # restore), so it must not share a checkout with build or the smoke tests.
    # And its result is orthogonal: "are the gates real?" is a different question
    # from "does this commit pass them", and a reader should be able to see which
    # of the two went red without reading the log.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove every gate fires
        run: pnpm validate:enforcement-liveness
        env:
          # This job runs the probes, and the validate:schema-parity probe
          # (CTL-011) shells out to the Sanity CLI for the deployed side. Without
          # this the control run exits 1 on a clean tree, gateProbe reports PROBE
          # INVALID, and the harness exits 1 — which took run 31321405963 red on
          # 2026-08-09 with no gate actually broken.
          #
          # Same secret and same mapping as the *Validate schema parity* step in
          # the `ci` job. It is repeated rather than shared because this is a
          # separate job with its own checkout, by design (see the job comment).
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_SCHEMA_PARITY }}

          # Same reason, different gate: the validate:epic-docs probe (CTL-024)
          # needs Linear to reach the real gate. Without this it reported
          # `skipped — no LINEAR_API_KEY available` *inside CI*, while its own
          # message claimed "CI carries the secret" — so the gate was proven
          # nowhere: skipped locally and skipped here.
          #
          # Same secret as the *Validate epic docs* step in the `ci` job.
          # An orphaned issue does NOT redden this job: the probe distinguishes
          # a real-orphan control failure (SKIPPED — the gate is firing on a true
          # finding) from a script error (INVALID). Without that split, adding
          # this key would have moved SUG-281's warn conversion red rather than
          # removing it, since this job blocks.
          LINEAR_API_KEY: ${{ secrets.LINEAR_SUGARTOWN_STATS }}

      - name: Confirm the probes left no residue
        # Every probe restores what it touched via a cleanup stack. If the tree
        # is dirty here, a probe leaked — and a liveness checker that corrupts
        # the thing it inspects is worse than no liveness checker.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Liveness probes left the working tree dirty:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean — all probes restored cleanly."

  chromatic:
    name: Chromatic VRT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        run: pnpm --filter storybook chromatic --exit-zero-on-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
