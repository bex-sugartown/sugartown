  <text x="620" y="176" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0d1226">CLOSE-OUT</text>
  <text x="620" y="198" font-size="8" text-anchor="middle" fill="#0d1226" fill-opacity="0.6">merge ≠ shipped</text>
  <rect x="646" y="143" width="20" height="14" fill="#0d1226"/>
  <text x="656" y="153" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#f8f8fa">L2</text>

  <!-- 7 Release — L6 Compliance -->
  <rect x="680" y="150" width="96" height="64" fill="#ffffff" stroke="#0d1226"/>
  <text x="728" y="176" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#0d1226">RELEASE</text>
  <text x="728" y="198" font-size="8" text-anchor="middle" fill="#0d1226" fill-opacity="0.6">7 gates, kept</text>
  <rect x="754" y="143" width="20" height="14" fill="#0d1226"/>
  <text x="764" y="153" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#f8f8fa">L6</text>

