name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Validate · Build
    runs-on: ubuntu-latest

    # Sanity content-API config for the validate:* steps below.
    #
    # These are deliberately NOT secrets. Every VITE_-prefixed variable is inlined into
    # the client bundle at build time, so all three already ship to every visitor's
    # browser; poalmzla is additionally hardcoded in apps/studio/sanity.config.ts and in
    # eight migration scripts. Storing public config in the secret store bought no
    # security and cost reviewability: on 2026-07-28, validate:taxonomy ran in CI for the
    # first time in its existence and reported 19 tag documents, 63 dangling tag refs and
    # 24 dangling author refs — against a project that has 64 tags, 0 dangling refs, and
    # exactly one person document. The values in the secret store had drifted from the
    # real project and nothing could see it, because a secret cannot be read back.
    #
    # Public config belongs in the repo where a diff can catch it. The genuine credential
    # (a write token) is not needed here: these validators read published content only,
    # which is the correct thing to gate on — CI should check what visitors actually see,
    # not the state of unpublished drafts.
    env:
      VITE_SANITY_PROJECT_ID: poalmzla
      VITE_SANITY_DATASET: production
      VITE_SANITY_API_VERSION: '2025-02-02'

      # No VITE_SANITY_TOKEN. Removed 2026-08-08 by SUG-260 Phase 3.
      #
      # 110 published documents used to carry WordPress-migration ids of the form
      # wp.<type>.<id>. Sanity reads dots as path segments and the dataset's public grant
      # covers path `*` (one segment), so every dotted id was invisible to anonymous
      # queries, and CI had to authenticate or it validated a view no visitor got. On
      # 2026-07-28 an unauthenticated run reported 63 dangling tag refs and 24 dangling
      # author refs that resolved perfectly well for every real reader.
      #
      # Those ids are now `<type>-<slug>`, so anonymous reads see the whole published
      # dataset and CI validates exactly what a visitor sees. Verified 2026-08-08:
      # `validate:taxonomy --no-token` and `validate:filters --no-token` both exit 0.
      #
      # Drafts are still `drafts.<id>` and therefore still invisible anonymously. That is
      # correct here: CI gates on published content, not on unpublished drafts.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Validate URLs
        run: pnpm validate:urls

      - name: Validate filters
        run: pnpm validate:filters

      - name: Validate taxonomy
        run: pnpm validate:taxonomy

      - name: Validate schema parity
        run: pnpm validate:schema-parity
        env:
          # Sanity CLI auth (schema list/manifest extract), NOT the VITE_SANITY_*
          # content API vars used above. The @sanity/cli package only reads the
          # token from an env var literally named SANITY_AUTH_TOKEN, so the repo
          # secret (named SANITY_SCHEMA_PARITY) is mapped to that name here.
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_SCHEMA_PARITY }}

      # ST-95 — proves each gate below actually fires against a deliberate
      # violation, rather than merely being wired. validate:tokens,
      # validate:tokens:strict, validate:style-mirror, validate:dead-refs and
      # validate:css-names are otherwise pre-commit-hook-only (.husky/pre-commit)
      # and have no other CI step of their own — this is their only run here.
      # The boundary-rule probes re-exercise `pnpm lint` above, deliberately:
      # INC-011 was four ESLint rules that stayed wired and silent for 176 days.
      - name: Liveness probes
        run: pnpm validate:liveness-probes

      - name: Build
        run: pnpm build
        env:
          # apps/contentful-poc throws at module load without these
          # (src/lib/contentful.ts), so the whole build fails without them.
          # Latent until 2026-07-28: CI had never reached the Build step, because
          # it died at Lint or Typecheck on every run since 2026-05-10.
          #
          # These ARE secrets, unlike the VITE_SANITY_* config above. That config
          # is inlined into a client bundle and already public; this is a
          # server-side Contentful Content Delivery API key that never reaches a
          # browser (note the deliberate absence of a NEXT_PUBLIC_ prefix). It is
          # read-only and scoped to published content — the Content Management
          # token, which can write, is used only by migration scripts and must
          # never appear here.
          #
          # CONTENTFUL_ENVIRONMENT is omitted: the code already defaults to
          # "master", and a second way to say the same thing is a second thing to
          # keep in sync.
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Route smoke tests
        run: pnpm test:smoke
        env:
          CI: true

  chromatic:
    name: Chromatic VRT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        run: pnpm --filter storybook chromatic --exit-zero-on-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
