<svg viewBox="0 0 1360 940" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="ontologyTitle ontologyDesc">
  <title id="ontologyTitle">Sugartown Ontology Map — Core Content to Taxonomy</title>
  <desc id="ontologyDesc">
    Diagram of Sugartown's content ontology: article, node, caseStudy, page and series
    reference the category, tag, tool, project, person and glossaryTerm taxonomy types.
    Solid lines are fully displayed connections; dashed grey lines are schema-only gaps.
    The glossaryTerm-to-category connection is highlighted in pink as a partial failure:
    the chip renders correctly, but the category page's own content query excludes
    glossaryTerm, so it reports no content even when terms reference it.
  </desc>

  <defs>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-content: #f8f8fa;
        --surface-tax: #f0fdf9;
        --surface-glossary: #fff0f6;
        --border: #b0b0b0;
        --border-content: #94a3b8;
        --border-tax: #25b895;
        --text: #1e1e1e;
        --text-dim: #526070;
        --edge: #333333;
        --edge-gap: #94a3b8;
        --edge-dotted: #94a3b8;
        --accent-glossary: #e00069;
        --accent-error: #e00069;
        --callout-bg: #fff0f6;
        --callout-border: #ff247d;
        --badge-bg: #1e1e1e;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1226;
          --surface: #141830;
          --surface-content: #171c38;
          --surface-tax: #10241f;
          --surface-glossary: #2a0e1c;
          --border: #526070;
          --border-content: #526070;
          --border-tax: #2bd4aa;
          --text: #f1f2f4;
          --text-dim: #94a3b8;
          --edge: #bcc5d1;
          --edge-gap: #526070;
          --edge-dotted: #526070;
          --accent-glossary: #ff4d99;
          --accent-error: #ff4d99;
          --callout-bg: #2a0e1c;
          --callout-border: #ff4d99;
          --badge-bg: #f1f2f4;
          --badge-text: #0d1226;
        }
      }

      .bg { fill: var(--bg); }
      .node-content { fill: var(--surface-content); stroke: var(--border-content); stroke-width: 1.5; }
      .node-tax { fill: var(--surface-tax); stroke: var(--border-tax); stroke-width: 1.5; }
      .node-glossary { fill: var(--surface-glossary); stroke: var(--accent-glossary); stroke-width: 2; }
      .node-label { font-family: "DM Sans", "Helvetica Neue", Arial, sans-serif; font-weight: 600; font-size: 17px; fill: var(--text); }
      .node-sub { font-family: "IBM Plex Mono", "Courier New", monospace; font-size: 10.5px; fill: var(--text-dim); letter-spacing: 0.02em; }
      .title { font-family: "Cormorant Garamond", "Times New Roman", serif; font-weight: 600; font-size: 30px; fill: var(--text); }
      .subtitle { font-family: "DM Sans", sans-serif; font-size: 14.5px; fill: var(--text-dim); }
      .footer { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; fill: var(--text-dim); }
      .cluster-label { font-family: "IBM Plex Mono", monospace; font-size: 11px; fill: var(--text-dim); letter-spacing: 0.03em; }
      .legend-text { font-family: "DM Sans", sans-serif; font-size: 12px; fill: var(--text); }
      .legend-key { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--text-dim); }

      .edge-solid { stroke: var(--edge); stroke-width: 1.6; fill: none; }
      .edge-gap { stroke: var(--edge-gap); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
      .edge-dotted { stroke: var(--edge-dotted); stroke-width: 1.3; fill: none; stroke-dasharray: 1.5 3.5; }
      .edge-error { stroke: var(--accent-error); stroke-width: 2.6; fill: none; stroke-dasharray: 7 5; }

      .cluster-frame { fill: none; stroke: var(--border-content); stroke-width: 1; stroke-dasharray: 2 3; }

      .badge-circle { fill: var(--badge-bg); }
      .badge-text { font-family: "IBM Plex Mono", monospace; font-size: 10px; fill: var(--badge-text); font-weight: 600; }

      .callout-box { fill: var(--callout-bg); stroke: var(--callout-border); stroke-width: 1.5; }
      .callout-text { font-family: "DM Sans", sans-serif; font-size: 12.5px; fill: var(--text); }
      .callout-label { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; fill: var(--accent-error); font-weight: 600; letter-spacing: 0.03em; }
    </style>

    <marker id="arrowSolid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" />
    </marker>
    <marker id="arrowGap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge-gap)" />
    </marker>
    <marker id="arrowError" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-error)" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1360" height="940" />

  <!-- Title -->
  <text class="title" x="40" y="46">Sugartown Ontology Map — Core Content ↔ Taxonomy</text>
  <text class="subtitle" x="40" y="70">The Bextionary gap: a glossary term's category chip renders correctly — its destination doesn't</text>

  <!-- ══════════════ CLUSTER: article / node / caseStudy ══════════════ -->
  <rect class="cluster-frame" x="48" y="96" width="272" height="330" rx="0" />
  <text class="cluster-label" x="60" y="116">CONTENT TYPES — IDENTICAL TAXONOMY SHAPE</text>

  <g id="node-article">
    <rect class="node-content" x="64" y="130" width="240" height="60" />
    <text class="node-label" x="80" y="156">article</text>
    <text class="node-sub" x="80" y="174">categories · tags · tools · projects</text>
  </g>
  <g id="node-node">
    <rect class="node-content" x="64" y="228" width="240" height="60" />
    <text class="node-label" x="80" y="254">node</text>
    <text class="node-sub" x="80" y="272">categories · tags · tools · projects</text>
  </g>
  <g id="node-caseStudy">
    <rect class="node-content" x="64" y="326" width="240" height="60" />
    <text class="node-label" x="80" y="352">caseStudy</text>
    <text class="node-sub" x="80" y="370">categories · tags · tools · projects</text>
  </g>

  <!-- trunk junction for the cluster -->
  <circle cx="352" cy="258" r="3.5" fill="var(--edge)" />
  <path class="edge-solid" d="M304,160 C332,160 332,258 352,258" />
  <path class="edge-solid" d="M304,258 L352,258" />
  <path class="edge-solid" d="M304,356 C332,356 332,258 352,258" />

  <!-- ══════════════ page (separate — partial gaps) ══════════════ -->
  <g id="node-page">
    <rect class="node-content" x="64" y="452" width="240" height="60" />
    <text class="node-label" x="80" y="478">page</text>
    <text class="node-sub" x="80" y="496">authors · tools — see gaps below</text>
  </g>

  <!-- ══════════════ series ══════════════ -->
  <g id="node-series">
    <rect class="node-content" x="84" y="572" width="200" height="52" />
    <text class="node-label" x="100" y="595">series</text>
    <text class="node-sub" x="100" y="611">query-time fallback</text>
  </g>
  <path class="edge-dotted" d="M352,258 C260,340 260,470 184,572" marker-end="url(#arrowSolid)" opacity="0.55"/>
  <path class="edge-dotted" d="M184,512 L184,572" marker-end="url(#arrowSolid)" opacity="0.7"/>

  <!-- ══════════════ TAXONOMY column ══════════════ -->
  <text class="cluster-label" x="1080" y="116">TAXONOMY PRIMITIVES</text>

  <g id="node-category">
    <rect class="node-tax" x="1080" y="130" width="220" height="60" />
    <circle class="badge-circle" cx="1288" cy="142" r="10" />
    <text class="badge-text" x="1288" y="146" text-anchor="middle">↩</text>
    <text class="node-label" x="1096" y="156">category</text>
    <text class="node-sub" x="1096" y="174">the epic's fix target</text>
  </g>
  <g id="node-tag">
    <rect class="node-tax" x="1080" y="228" width="220" height="60" />
    <circle class="badge-circle" cx="1288" cy="240" r="10" />
    <text class="badge-text" x="1288" y="244" text-anchor="middle">↩</text>
    <text class="node-label" x="1096" y="254">tag</text>
    <text class="node-sub" x="1096" y="272">+project assigns-content</text>
  </g>
  <g id="node-tool">
    <rect class="node-tax" x="1080" y="326" width="220" height="60" />
    <text class="node-label" x="1096" y="352">tool</text>
    <text class="node-sub" x="1096" y="370">article · node · caseStudy</text>
  </g>
  <g id="node-project">
    <rect class="node-tax" x="1080" y="424" width="220" height="60" />
    <circle class="badge-circle" cx="1288" cy="436" r="10" />
    <text class="badge-text" x="1288" y="440" text-anchor="middle">↩</text>
    <text class="node-label" x="1096" y="450">project</text>
    <text class="node-sub" x="1096" y="468">assigned-content panel</text>
  </g>
  <g id="node-person">
    <rect class="node-tax" x="1080" y="522" width="220" height="60" />
    <text class="node-label" x="1096" y="548">person</text>
    <text class="node-sub" x="1096" y="566">expertise → category</text>
  </g>

  <!-- cluster trunk → taxonomy branches (solid, displayed) -->
  <path class="edge-solid" d="M352,258 C700,258 900,160 1080,160" marker-end="url(#arrowSolid)" />
  <path class="edge-solid" d="M352,258 C700,258 900,258 1080,258" marker-end="url(#arrowSolid)" />
  <path class="edge-solid" d="M352,258 C700,258 900,356 1080,356" marker-end="url(#arrowSolid)" />
  <path class="edge-solid" d="M352,258 C700,258 900,454 1080,454" marker-end="url(#arrowSolid)" />
  <path class="edge-solid" d="M352,258 C700,300 900,552 1080,552" marker-end="url(#arrowSolid)" />
  <text class="node-sub" x="640" y="248">categories · tags · tools · projects · authors</text>

  <!-- page → taxonomy (mixed: solid where displayed, dashed where gap) -->
  <path class="edge-solid" d="M304,470 C620,470 900,356 1080,346" marker-end="url(#arrowSolid)" opacity="0.9"/>
  <path class="edge-solid" d="M304,482 C700,482 900,540 1080,548" marker-end="url(#arrowSolid)" opacity="0.9"/>
  <path class="edge-gap" d="M304,458 C620,300 900,180 1080,160" marker-end="url(#arrowGap)" />
  <path class="edge-gap" d="M304,466 C650,340 900,250 1080,254" marker-end="url(#arrowGap)" />
  <text class="node-sub" x="336" y="420" fill="var(--text-dim)">page → category/tag: gap #3</text>

  <!-- person → category (expertise), outer loop on far right -->
  <path class="edge-solid" d="M1300,552 C1350,552 1350,160 1300,160" marker-end="url(#arrowSolid)" />
  <text class="node-sub" x="1306" y="360" transform="rotate(90 1306,360)">expertise</text>

  <!-- ══════════════ glossaryTerm ══════════════ -->
  <g id="node-glossaryTerm">
    <rect class="node-glossary" x="560" y="740" width="280" height="86" />
    <text class="node-label" x="580" y="772" fill="var(--accent-glossary)">glossaryTerm</text>
    <text class="node-sub" x="580" y="792">relatedTags · relatedTools · relatedTerms ↺</text>
    <text class="node-sub" x="580" y="808">categories — 🟡 partial (see callout)</text>
  </g>

  <!-- content cluster → glossaryTerm (relatedTerms, displayed) -->
  <path class="edge-solid" d="M352,258 C420,400 460,600 600,740" marker-end="url(#arrowSolid)" opacity="0.85" />
  <!-- page → glossaryTerm (schema-only gap, SUG-210) -->
  <path class="edge-gap" d="M304,494 C420,600 480,680 580,740" marker-end="url(#arrowGap)" />
  <text class="node-sub" x="360" y="640" fill="var(--text-dim)">page → glossaryTerm: 🔴 schema-only (gap #2)</text>

  <!-- glossaryTerm → tag / tool (displayed) -->
  <path class="edge-solid" d="M840,760 C960,700 1020,320 1080,300" marker-end="url(#arrowSolid)" />
  <path class="edge-solid" d="M840,772 C980,760 1040,270 1080,250" marker-end="url(#arrowSolid)" />

  <!-- glossaryTerm self-loop (relatedTerms self-ref) -->
  <path class="edge-solid" d="M560,760 C520,730 520,700 555,700 C580,700 580,725 566,742" fill="none" marker-end="url(#arrowSolid)" opacity="0.75" />

  <!-- ══════════════ THE HIGHLIGHTED EDGE: glossaryTerm → category ══════════════ -->
  <path class="edge-error" d="M700,740 C700,520 820,300 1080,158" marker-end="url(#arrowError)" />
  <g transform="translate(760,470)">
    <polygon points="0,-13 13,10 -13,10" fill="var(--accent-error)" opacity="0.15" stroke="var(--accent-error)" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="700" fill="var(--accent-error)">!</text>
  </g>

  <!-- Callout box for the highlighted edge -->
  <g id="callout">
    <rect class="callout-box" x="360" y="500" width="360" height="118" />
    <text class="callout-label" x="378" y="524">GAP #1 — THIS EPIC'S FIX</text>
    <text class="callout-text" x="378" y="548">The category chip on a glossary term page</text>
    <text class="callout-text" x="378" y="566">renders and links correctly — but</text>
    <text class="callout-text" x="378" y="584">/categories/:slug's own content query</text>
    <text class="callout-text" x="378" y="602">excludes glossaryTerm. Bextionary reports</text>
    <text class="callout-text" x="378" y="614" font-weight="600">"no content" with 9 terms attached.</text>
  </g>
  <path class="edge-error" d="M620,530 C680,520 720,500 758,478" opacity="0.6" marker-end="url(#arrowError)" />

  <!-- ══════════════ Legend ══════════════ -->
  <g id="legend" transform="translate(64,860)">
    <line x1="0" y1="0" x2="34" y2="0" class="edge-solid" />
    <text class="legend-text" x="42" y="4">displayed — query dereferences it, a page renders it</text>

    <line x1="0" y1="22" x2="34" y2="22" class="edge-gap" />
    <text class="legend-text" x="42" y="26">schema-only / gap — field exists, nothing shows it</text>

    <line x1="0" y1="44" x2="34" y2="44" class="edge-dotted" />
    <text class="legend-text" x="42" y="48">query-time fallback (e.g. series reverse lookup)</text>
  </g>
  <g id="legend2" transform="translate(700,860)">
    <line x1="0" y1="0" x2="34" y2="0" class="edge-error" />
    <text class="legend-text" x="42" y="4">highlighted — partially works, this epic's fix target</text>

    <circle class="badge-circle" cx="10" cy="22" r="9" />
    <text class="badge-text" x="10" y="26" text-anchor="middle">↩</text>
    <text class="legend-text" x="42" y="26">Studio "Assigned content" incoming backlink</text>
  </g>

  <text class="footer" x="1296" y="924" text-anchor="end">docs/briefs/sugartown-ontology-map.md · SUG-222 · 2026-07-19</text>
</svg>
